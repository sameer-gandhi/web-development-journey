<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login-form</title>
</head>
<style>
    *{
        padding: 0;
        margin: 0;
        line-height: 2;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        text-align: center;
    }
    body{
        margin: 10% 10% 10% 10%;
        background-color: rgba(87, 170, 42, 0.807);
    }
    div{
        width: 80vw;
        /* margin-bottom: 10px; */
    }
    .heading{
        background-color: aqua;
        border: 2px solid rgb(0, 0, 0);
        border-radius: 10px;
    }
    form{
        border: 2px solid black;
        border-radius: 10px;
        width: 80vw;
        background-color: white;
    }
    input{
        background-color: beige;
        border-radius: 10px;
    }
    ::placeholder{
        color: black;
        font-weight: 500;
        padding: 10px;
    }
    select{
        background-color: beige;
        border: 2px solid black;
        border-radius: 10px;
        color: black;
        font-weight: 500;
        padding: 5px;
    }
    p{
        font-size: large;
        font-weight: 500;
        color: rgba(52, 8, 249, 0.752);
    }
    label{
        margin: 5px;
        color: black;
        font-weight: 500;
    }
    .buttons{
        margin: 10px 0px 10px 0px;
    }
    button{
        border: 2px solid black;
        padding: 1px 20px 1px 20px;
        border-radius: 40px;
        font-weight: 500;
        cursor: pointer;
    }
    [type="submit"]{
        color: blue;
        background-color: aqua;
    }
    button:hover{
        background-color: yellow;
        border: none;
    }
    [type="reset"]{
        margin-left: 30px;
        color: black;
        background-color: rgba(251, 11, 11, 0.637);
    }
</style>
<body>
    <div>
        <h1 class="heading">Login or SignUp</h1>
    </div>
    <form action="action.php" method="post">
        <p>Your Name:</p>
        <input type="text" name="username" placeholder="Enter Your name">
        <p>Mobile no.:</p>
        <input type="tel" name="mobile" placeholder="Mob no.">
        <p>password:</p>
        <input type="password" name="pass" placeholder="Enter password">
        <p>Gender:</p>
        <input type="radio" name="gender" id="Male" value="Male">
        <label for="Male">Male</label>
        <input type="radio" name="gender" id="Female" value="Female">
        <label for="Female">Female</label>
        <input type="radio" name="gender" id="Other" value="Other">
        <label for="Other">Other</label>
        <p>Select your State:</p>
        <select name="state">
            <option value="Uttar Pradesh">Uttar Pradesh</option>
            <option value="Uttrakhand">Uttrakhand</option>
            <option value="delhi">Delhi</option>
        </select>
        <p class="buttons"><button type="submit">Log In</button><button type="reset">Reset</button> </p>
    </form>
</body>
</html>
