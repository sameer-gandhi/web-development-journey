<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nav bar</title>
  </head>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Baloo+Bhai+2:wght@400..800&display=swap");
    :root {
      --navbg: black;
      --navcolor: white;
      --mainbg: rgba(44, 43, 84, 0.929);
      --maincolor: yellow;
      --font: "Times New Roman", Times, serif;
    }

    * {
      padding: 0;
      margin: 0;
      box-sizing: border-box;
    }

    body {
        font-family: "Baloo Bhai 2", sans-serif;
        background-color: var(--mainbg);
    }

    ::selection {
      background-color: rgb(95, 43, 214);
      color: aliceblue;
    }

    nav {
      display: flex;
      align-items: center;
      background-color: var(--navbg);
      padding: 20px;
    }

    a {
      padding: 10px 20px;
      text-decoration: none;
      color: var(--navcolor);
      font-size: 15px;
    }

    a:hover {
      color: var(--maincolor);
      background-color: var(--mainbg);
      border-radius: 5px;
      cursor: pointer;
    }

    .icon {
      color: var(--maincolor);
      font-size: 25px;
      margin-right: auto;
    }
  </style>

  <body>
    <nav>
      <a href="" class="icon">Sameer's web</a>

      <a href="">Home</a>
      <a href="">About</a>
      <a href="">Contact</a>
      <a href="">Sign</a>
    </nav>
  </body>
</html>
